site_name: Lee An-cheng Curatorial Platform
site_description: Museum-Grade Curating & Virtual Gallery Platform Specification
site_author: Gregoire Colombet
site_url: https://gregoirecolombet.github.io/Curating_LeeAnCheng/
repo_name: GregoireColombet/Curating_LeeAnCheng
repo_url: https://github.com/GregoireColombet/Curating_LeeAnCheng

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GregoireColombet/Curating_LeeAnCheng

nav:
  - Overview: index.md
  - Cultural Standards & Crosswalk: standards.md
  - System Architecture: architecture.md
  - Back-Office CMS Features: backend.md
  - Front-Office & 3D Gallery: frontend.md
  - Project Prerequisites: prerequisites.md
  - Project Management Plan: project-management.md
  - Strategic Innovations: innovations.md
  - Full Specification (Single Page): full-spec.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
